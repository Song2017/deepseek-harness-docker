services:
  dsh:
    build: .
    ports:
      - "3080:3080"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - PROXY_USERNAME=${PROXY_USERNAME:-}
      - PROXY_PASSWORD=${PROXY_PASSWORD:-}
    volumes:
      - dsh-data:/home/node/.dsh
    restart: unless-stopped

volumes:
  dsh-data:
